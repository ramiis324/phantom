        <script>
            /* Some inbound links arrive with tracking junk tacked on, e.g.
               flash.html?helixjump&i=1. The game lookup reads the whole query
               as the name, so put the URL back in canonical form first. */
            (function () {
                var q = location.search;
                if (q.indexOf("&") === -1) return;
                var name = q.slice(1).split("&")[0];
                if (!name) return;
                location.replace(location.pathname + "?" + name + (location.hash || ""));
            })();
        </script>

        <style>
        :root {
            --accent: greenyellow;
            --accent2: #212121;
        }
            html, body {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #000;
            }
            .loading {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                z-index: 10;
            }
            .loading .bar {
                width: 200px;
                height: 4px;
                background: rgba(173, 255, 47, 0.2);
                border-radius: 4px;
                overflow: hidden;
            }
            .loading .bar-fill {
                height: 100%;
                width: 30%;
                background: var(--accent);
                border-radius: 4px;
                animation: loadingBar 1.4s ease-in-out infinite;
            }
        @keyframes loadingBar {
            0% { transform: translateX(-100%); width: 30%; }
            50% { width: 50%; }
            100% { transform: translateX(400%); width: 30%; }
        }

        #controls {
            position: fixed;
            left: 12px;
            top: 16px;
            z-index: 160;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 44px;
            background: rgba(0, 0, 0, 0.7);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 100px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: grab;
            user-select: none;
            padding: 6px;
            overflow: hidden;
        }
        #controls.collapsed {
            padding: 0;
            gap: 0;
            transform: translateX(-12px);
            border-radius: 0 100px 100px 0;
        }
        #controls.collapsed .ctrl-actions {
            display: none;
        }
        #controls.collapsed .ctrl-toggle svg {
            transform: rotate(180deg);
        }
        .ctrl-toggle {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: #fff;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), background 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ctrl-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .ctrl-toggle svg {
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ctrl-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }
        .back-btn {
            background: transparent;
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .ctrl-bookmark-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: #fff;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .ctrl-bookmark-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .ctrl-bookmark-btn svg {
            width: 22px;
            height: 22px;
        }

        #pause-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #pause-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #pause-overlay .pause-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            color: #fff;
            font-family: sans-serif;
            user-select: none;
            cursor: pointer;
        }
        #pause-overlay .pause-box svg {
            width: 56px;
            height: 56px;
            opacity: 0.9;
        }
        #pause-overlay .pause-text {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        /* Toolbox pause: lighter dim, no resume prompt. */
        #pause-overlay.dim {
            background: rgba(0, 0, 0, 0);
            pointer-events: none;
        }
        #pause-overlay.dim .pause-box {
            opacity: 0;
        }
    </style>

        <script>
            function clean(name) {
                return name.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            }

            function computeGenre(name) {
                var n = String(name || "").toLowerCase();
                var cats = [
                    [/flash/, "Flash"], [/minecraft/, "Minecraft"], [/emulator|retro|nes|snes|genesis|gba/, "Emulator"],
                    [/horror|fnaf|scary|granny/, "Horror"], [/cook|bake|kitchen/, "Cooking"], [/puzzle|match|tetris|sudoku/, "Puzzle"],
                    [/tower|defen/, "Tower Defense"], [/rac|drive|kart|moto/, "Racing"], [/shoot|fps|gun|war|battle/, "Shooter"],
                    [/sport|football|soccer|basket|golf/, "Sports"], [/run|dash|endless/, "Runner"], [/click|idle/, "Clicker"],
                    [/sandbox|craft/, "Sandbox"], [/sim|life|city|farm|tycoon/, "Life/Sim"], [/strateg|chess|checkers/, "Strategy"],
                    [/fight|combat|action|adventure/, "Action"]
                ];
                for (var i = 0; i < cats.length; i++) if (cats[i][0].test(n)) return cats[i][1];
                return "Flash";
            }

            /* Level curve: Lv N needs 60*(N-1)^2 total XP (same as home page). */
            window.phantomAccountStats = function () {
                var map = {};
                try { map = JSON.parse(localStorage.getItem("rcdn-playtime") || "{}"); } catch (e) {}
                var seconds = 0, played = 0;
                for (var k in map) {
                    var v = +map[k] || 0;
                    if (v > 0) { seconds += v; played++; }
                }
                var xp = Math.round(seconds) + played * 60;
                var level = Math.floor(Math.sqrt(xp / 60)) + 1;
                var from = 60 * (level - 1) * (level - 1);
                var to = 60 * level * level;
                var pct = Math.max(0, Math.min(100, ((xp - from) / (to - from)) * 100));
                return { xp: xp, level: level, pct: pct, seconds: seconds, played: played };
            };

            function loadGame(games, player) {
                const flashName = (location.search.split("?")[1] || "").split("&")[0];
                const isGame = games.find((game) => clean(game.gameName) == flashName);

                if (isGame) {
                    window.PHANTOM = {
                        cleanName: flashName,
                        title: isGame.gameName,
                        genre: computeGenre(isGame.gameName),
                        stats: (window.getAccountStats ? window.getAccountStats() : (window.phantomAccountStats ? window.phantomAccountStats() : null)),
                        username: (function () { try { return (JSON.parse(localStorage.getItem("social.v1") || "null") || {}).profile.username; } catch (e) { return null; } })(),
                        avatarSrc: (function () { try { var p = (JSON.parse(localStorage.getItem("social.v1") || "null") || {}).profile; return window.profilePictureSrc ? window.profilePictureSrc(p) : null; } catch (e) { return null; } })(),
                        gameFrame: function () { return document.querySelector("ruffle-player"); },
                        initialView: false
                    };
                    if (window.grainient) window.grainient.setup({ label: isGame.gameName });
                    player.ruffle().load(CDN + "flash/" + flashName + ".swf");
                }
            }

            (async function init() {
                const loading = document.getElementById("loading");

                const games = await loadGameCatalog();

                let ruffle = window.RufflePlayer.newest();
                let player = ruffle.createPlayer();

                player.style.width = "100vw";
                player.style.height = "100vh";
                document.body.appendChild(player);

                loadGame(games, player);

                player.addEventListener("loadeddata", () => {
                    loading.style.display = "none";
                    if (window.grainient) window.grainient.ready();
                });
                setTimeout(() => {
                    if (loading.style.display !== "none") loading.style.display = "none";
                    if (window.grainient) window.grainient.ready();
                }, 15000);
            })();
        </script>

            EXIT_ICONS.explore = EXIT_ICONS.games;
            const EXIT_URLS = {
                home: "index.html",
                games: "index.html?view=explore",
                explore: "index.html?view=explore",
                bookmarks: "index.html?view=bookmarks",
                movies: "index.html?view=movies",
                shows: "index.html?view=shows",
                leaderboard: "index.html?view=leaderboard",
                settings: "index.html?view=settings"
            };
            const exitBtn = document.getElementById("ctrl-home");
            let exitTarget = localStorage.getItem("rcdn-exit-target") || "explore";
            if (!EXIT_URLS[exitTarget]) exitTarget = "explore";
            exitBtn.innerHTML = EXIT_ICONS[exitTarget] || EXIT_ICONS.home;
            exitBtn.title = exitTarget.charAt(0).toUpperCase() + exitTarget.slice(1);
            exitBtn.addEventListener("click", () => {
                location.href = EXIT_URLS[exitTarget];
            });

            let isDragging = false;
            let wasDragged = false;
            let startY, startTop;

            function isDragHandle(el) {
                return !el.closest("#ctrl-actions");
            }

            controls.addEventListener("mousedown", (e) => {
                if (!isDragHandle(e.target)) return;
                isDragging = true;
                wasDragged = false;
                startY = e.clientY;
                startTop = controls.offsetTop;
                controls.style.cursor = "grabbing";
                e.preventDefault();
            });

            document.addEventListener("mousemove", (e) => {
                if (!isDragging) return;
                const dy = e.clientY - startY;
                if (Math.abs(dy) > 5) wasDragged = true;
                let newTop = startTop + dy;
                const maxTop = window.innerHeight - controls.offsetHeight;
                newTop = Math.max(0, Math.min(newTop, maxTop));
                controls.style.top = newTop + "px";
            });

            document.addEventListener("mouseup", () => {
                if (!isDragging) return;
                isDragging = false;
                controls.style.cursor = "grab";
                if (wasDragged) {
                    localStorage.setItem("controls-top", controls.style.top);
                }
            });

            controls.addEventListener("touchstart", (e) => {
                if (!isDragHandle(e.target)) return;
                isDragging = true;
                wasDragged = false;
                startY = e.touches[0].clientY;
                startTop = controls.offsetTop;
            });

            document.addEventListener("touchmove", (e) => {
                if (!isDragging) return;
                const dy = e.touches[0].clientY - startY;
                if (Math.abs(dy) > 5) wasDragged = true;
                let newTop = startTop + dy;
                const maxTop = window.innerHeight - controls.offsetHeight;
                newTop = Math.max(0, Math.min(newTop, maxTop));
                controls.style.top = newTop + "px";
            });

            document.addEventListener("touchend", () => {
                if (!isDragging) return;
                isDragging = false;
                if (wasDragged) {
                    localStorage.setItem("controls-top", controls.style.top);
                }
            });

            const bookmarkBtn = document.getElementById("bookmark-btn");
            const urlGameName = (location.search.split("?")[1] || "").split("&")[0];
            if (urlGameName) {
                /* The controls-bar button opens the toolbox; its icon is the
                   toolbox crate and is never filled, even for bookmarked
                   games. Bookmarking is toggled inside the toolbox. */
                bookmarkBtn.addEventListener("click", () => {
                    if (window.__openToolbox) window.__openToolbox();
                });
            }

            function applyControlVisibility() {
                const showCollapse = localStorage.getItem("phantom-btn-collapse") !== "0";
                const toggleEl = document.querySelector("#controls .ctrl-toggle");
                if (toggleEl) toggleEl.style.display = showCollapse ? "" : "none";
                if (!showCollapse) controls.classList.remove("collapsed");
            }
            applyControlVisibility();
            window.addEventListener("phantom-display-change", applyControlVisibility);
        </script>
        <script>
            (function () {
                var PAUSE_DELAY = 90000; /* 1.5 min away before auto-pausing */
                var overlay = document.getElementById("pause-overlay");
                if (!overlay) return;
                var paused = false;
                var hidden = false;
                var frozenAt = null;
                var awayTimer = null;
                var listeners = [];

                function gameFrame() {
                    return document.getElementById("game-frame") || document.querySelector("ruffle-player");
                }
                function notify() {
                    for (var i = 0; i < listeners.length; i++) {
                        try { listeners[i](paused); } catch (e) {}
                    }
                }
                function setPaused(p, silent) {
                    paused = p;
                    overlay.classList.toggle("active", p);
                    overlay.classList.toggle("dim", !!p && !!silent);
                    var f = gameFrame();
                    /* Silent (toolbox) pause keeps the frame visible so the
                       game still shows through the light backdrop. */
                    if (f) f.style.visibility = (p && !silent) ? "hidden" : "visible";
                    notify();
                }
                function armTimer() {
                    if (!paused && hidden) {
                        awayTimer = setTimeout(function () { setPaused(true); }, PAUSE_DELAY);
                    }
                }
                function onHidden() {
                    hidden = true;
                    clearTimeout(awayTimer);
                    armTimer();
                    notify();
                }
                function onVisible() {
                    hidden = false;
                    clearTimeout(awayTimer);
                    notify();
                }
                overlay.addEventListener("click", function () {
                    if (paused) setPaused(false);
                });
                document.addEventListener("visibilitychange", function () {
                    if (document.visibilityState === "hidden") onHidden();
                    else onVisible();
                });
                document.addEventListener("freeze", function () {
                    frozenAt = Date.now();
                    onHidden();
                });
                document.addEventListener("resume", function () {
                    if (frozenAt != null && Date.now() - frozenAt >= PAUSE_DELAY) setPaused(true);
                    frozenAt = null;
                    if (document.visibilityState === "hidden") onHidden();
                    else onVisible();
                });
                window.addEventListener("pagehide", function () { clearTimeout(awayTimer); });

                window.__isPaused = function () { return paused; };
                window.__setPaused = setPaused;
                window.__addPauseListener = function (fn) { listeners.push(fn); notify(); };
            })();
        </script>
        <script>
            (function () {
                var KEY = "rcdn-playtime";
                var LP_KEY = "rcdn-lastplayed";
                var name = ((location.search.split("?")[1] || "").split("&")[0]).toLowerCase();
                if (!name) return;
                var start = null;
                var timer = null;
                function loadMap(k) { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (e) { return {}; } }
                function touchLast() {
                    var m = loadMap(LP_KEY);
                    m[name] = Date.now();
                    try { localStorage.setItem(LP_KEY, JSON.stringify(m)); } catch (e) {}
                }
                function flush() {
                    if (start == null) return;
                    var now = Date.now();
                    var secs = Math.max(0, Math.floor((now - start) / 1000));
                    if (secs) {
                        var m = loadMap(KEY);
                        m[name] = (m[name] || 0) + secs;
                        try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {}
                        /* A minute of play counts the day. */
                        if (window.RCDNStreak) window.RCDNStreak.play(secs);
                    }
                    start = now;
                }
                function isRunning() {
                    if (document.visibilityState !== "visible") return false;
                    if (window.__isPaused && window.__isPaused()) return false;
                    return true;
                }
                function loop() {
                    flush();
                    if (isRunning()) {
                        touchLast();
                        timer = setTimeout(loop, 5000);
                    } else {
                        start = null;
                    }
                }
                function refresh() {
                    clearTimeout(timer);
                    if (isRunning()) {
                        if (start == null) { start = Date.now(); touchLast(); }
                        timer = setTimeout(loop, 5000);
                    } else {
                        flush();
                        start = null;
                    }
                }
                window.addEventListener("pageshow", refresh);
                window.addEventListener("pagehide", flush);
                window.addEventListener("blur", flush);
                window.addEventListener("beforeunload", flush);
                document.addEventListener("visibilitychange", refresh);
                document.addEventListener("freeze", flush);
                if (window.__addPauseListener) window.__addPauseListener(refresh);
                refresh();
            })();
        </script>

            (function () {
