    <script>
        /* Some inbound links arrive with tracking junk tacked on, e.g.
           player.html?helixjump&i=1. The game lookup reads the whole query
           as the name, so put the URL back in canonical form first. */
        (function () {
            var q = location.search;
            if (q.indexOf("&") === -1) return;
            var name = q.slice(1).split("&")[0];
            if (!name) return;
            location.replace(location.pathname + "?" + name + (location.hash || ""));
        })();
    </script>
    <link rel="stylesheet" href="toolbox.css?v=20" />
        <style>
        :root {
            --accent: greenyellow;
            --accent2: #212121;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #controls {
            position: fixed;
            left: 12px;
            top: 16px;
            z-index: 160;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 44px;
            background: rgba(0, 0, 0, 0.7);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 100px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: grab;
            user-select: none;
            padding: 6px;
            overflow: hidden;
        }
        #controls.collapsed {
            padding: 0;
            gap: 0;
            transform: translateX(-12px);
            border-radius: 0 100px 100px 0;
        }
        #controls.collapsed .ctrl-actions {
            display: none;
        }
        #controls.collapsed .ctrl-toggle svg {
            transform: rotate(180deg);
        }
        .ctrl-toggle {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: #fff;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), background 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ctrl-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .ctrl-toggle svg {
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ctrl-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }
        .back-btn {
            background: transparent;
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .ctrl-bookmark-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: #fff;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .ctrl-bookmark-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .ctrl-bookmark-btn svg {
            width: 22px;
            height: 22px;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .loading .bar {
            width: 200px;
            height: 4px;
            background: rgba(173, 255, 47, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        .loading .bar-fill {
            height: 100%;
            width: 30%;
            background: var(--accent);
            border-radius: 4px;
            animation: loadingBar 1.4s ease-in-out infinite;
        }
        @keyframes loadingBar {
            0% { transform: translateX(-100%); width: 30%; }
            50% { width: 50%; }
            100% { transform: translateX(400%); width: 30%; }
        }
        #pause-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #pause-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #pause-overlay .pause-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            color: #fff;
            font-family: sans-serif;
            user-select: none;
            cursor: pointer;
        }
        #pause-overlay .pause-box svg {
            width: 56px;
            height: 56px;
            opacity: 0.9;
        }
        #pause-overlay .pause-text {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        /* Toolbox pause: lighter dim, no resume prompt. */
        #pause-overlay.dim {
            background: rgba(0, 0, 0, 0);
            pointer-events: none;
        }
        #pause-overlay.dim .pause-box {
            opacity: 0;
        }
    </style>
    <style>
        /* --- Realtime message notification pill (account-card style) --- */
        #msg-pill {
            position: fixed;
            top: 16px;
            right: 24px;
            z-index: 400;
            display: inline-flex;
            align-items: center;
            gap: 11px;
            padding: 9px 10px 9px 9px;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.35);
            cursor: grab;
            touch-action: none;
            user-select: none;
            animation: msgPillIn .35s cubic-bezier(.22, 1, .36, 1) both;
        }
        #msg-pill[hidden] { display: none; }
        #msg-pill.leaving { transition: opacity .25s ease; opacity: 0; }
        @keyframes msgPillIn {
            from { opacity: 0; transform: translateY(-14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-pill-avatar {
            width: 38px; height: 38px; border-radius: 50%; overflow: hidden; flex: none;
            background: var(--accent, greenyellow); color: var(--accent2, #212121);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 16px;
        }
        .msg-pill-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .msg-pill-avatar svg { width: 20px; height: 20px; }
        .msg-pill-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; line-height: 1.15; }
        .msg-pill-name {
            font-size: 14px; font-weight: 700; color: #111827;
            max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .msg-pill-preview {
            font-size: 12.5px; color: #6b7280;
            max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .msg-pill-open {
            flex: none; width: 38px; height: 38px; border: none; border-radius: 50%;
            background: var(--accent, greenyellow); color: var(--accent2, #212121);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .msg-pill-open:hover { filter: brightness(1.05); }
        .msg-pill-open svg { width: 20px; height: 20px; }

        /* --- Floating DM window (draggable + resizable) --- */
        #msg-float {
            position: fixed;
            top: 70px; right: 24px;
            width: 320px; height: 420px;
            min-width: 260px; min-height: 280px;
            max-width: 92vw; max-height: 85vh;
            z-index: 410;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            display: flex; flex-direction: column;
            overflow: hidden;
            resize: both;
        }
        #msg-float[hidden] { display: none; }
        .msg-float-head {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-bottom: 1px solid #e5e7eb;
            background: #fff; flex: none;
            cursor: move; user-select: none;
        }
        .msg-float-title {
            flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: #111827;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .msg-float-close {
            width: 30px; height: 30px; flex: none; border: none; border-radius: 8px;
            background: #eef0f3; color: #374151; font-size: 18px; line-height: 1; cursor: pointer;
        }
        .msg-float-close:hover { background: #e2e5ea; }
        .msg-float-body {
            flex: 1; overflow-y: auto; padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
            background: #f9fafb;
        }
        .msg-float-row { display: flex; gap: 8px; max-width: 85%; }
        .msg-float-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-float-sender { font-size: 11px; color: #6b7280; padding: 0 3px; }
        .msg-float-bubble {
            padding: 7px 11px; border-radius: 12px; background: #eef0f3; color: #111827;
            font-size: 13px; line-height: 1.4; white-space: pre-wrap; word-break: break-word;
        }
        .msg-float-row.me .msg-float-bubble { background: var(--accent, greenyellow); color: var(--accent2, #212121); }
        .msg-float-compose {
            display: flex; gap: 8px; padding: 10px;
            border-top: 1px solid #e5e7eb; background: #fff; flex: none;
        }
        .msg-float-input {
            flex: 1; height: 36px; border: 1px solid #d1d5db; border-radius: 9px;
            padding: 0 10px; font: inherit; font-size: 13px; outline: none; color: #111827;
        }
        .msg-float-input:focus { border-color: #9ca3af; }
        .msg-float-send {
            width: 36px; height: 36px; flex: none; border: none; border-radius: 9px;
            background: var(--accent, greenyellow); color: var(--accent2, #212121);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .msg-float-send:disabled { opacity: .4; cursor: default; }
        .msg-float-send svg { width: 17px; height: 17px; }
        .msg-float-note { margin: auto; color: #6b7280; font-size: 13px; text-align: center; padding: 16px; }
    </style>
</head>

        (function () {
            /* The theme owns the accent in here too; the profile color only
               paints avatars, so it no longer shades the controls. */
            try {
                const t = window.grainient && window.grainient.theme;
                if (t) {
                    const r = document.documentElement.style;
                    r.setProperty("--accent", t.accent);
                    r.setProperty("--accent2", t.onAccent);
                }
            } catch (e) {}
        })();

        function isDragHandle(el) {
            return !el.closest("#ctrl-actions");
        }

        controls.addEventListener("mousedown", (e) => {
            if (!isDragHandle(e.target)) return;
            isDragging = true;
            wasDragged = false;
            startY = e.clientY;
            startTop = controls.offsetTop;
            controls.style.cursor = "grabbing";
            e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            const dy = e.clientY - startY;
            if (Math.abs(dy) > 5) wasDragged = true;
            let newTop = startTop + dy;
            const maxTop = window.innerHeight - controls.offsetHeight;
            newTop = Math.max(0, Math.min(newTop, maxTop));
            controls.style.top = newTop + "px";
        });

        document.addEventListener("mouseup", () => {
            if (!isDragging) return;
            isDragging = false;
            controls.style.cursor = "grab";
            if (wasDragged) {
                localStorage.setItem("controls-top", controls.style.top);
            }
        });

        controls.addEventListener("touchstart", (e) => {
            if (!isDragHandle(e.target)) return;
            isDragging = true;
            wasDragged = false;
            startY = e.touches[0].clientY;
            startTop = controls.offsetTop;
        });

        document.addEventListener("touchmove", (e) => {
            if (!isDragging) return;
            const dy = e.touches[0].clientY - startY;
            if (Math.abs(dy) > 5) wasDragged = true;
            let newTop = startTop + dy;
            const maxTop = window.innerHeight - controls.offsetHeight;
            newTop = Math.max(0, Math.min(newTop, maxTop));
            controls.style.top = newTop + "px";
        });

            if (!isDragging) return;

        function clean(str) {
            return str.toLowerCase().replace(/[^a-z0-9]/g, "");
        }

        /* Genre lookup mirrors Explore's regex categories so "See more like
           this" can jump to the right filtered Explore view. */
        window.__phantomGenre = "";
        function computeGenre(name) {
            var n = String(name || "").toLowerCase();
            var cats = [
                [/flash/, "Flash"], [/minecraft/, "Minecraft"], [/emulator|retro|nes|snes|genesis|gba/, "Emulator"],
                [/horror|fnaf|scary|granny/, "Horror"], [/cook|bake|kitchen/, "Cooking"], [/puzzle|match|tetris|sudoku/, "Puzzle"],
                [/tower|defen/, "Tower Defense"], [/rac|drive|kart|moto/, "Racing"], [/shoot|fps|gun|war|battle/, "Shooter"],
                [/sport|football|soccer|basket|golf/, "Sports"], [/run|dash|endless/, "Runner"], [/click|idle/, "Clicker"],
                [/sandbox|craft/, "Sandbox"], [/sim|life|city|farm|tycoon/, "Life/Sim"], [/strateg|chess|checkers/, "Strategy"],
                [/fight|combat|action|adventure/, "Action"]
            ];
            for (var i = 0; i < cats.length; i++) if (cats[i][0].test(n)) return cats[i][1];
            return "Games";
        }

        /* Level curve: Lv N needs 60*(N-1)^2 total XP (same as the home page). */
        window.phantomAccountStats = function () {
            var map = {};
            try { map = JSON.parse(localStorage.getItem("rcdn-playtime") || "{}"); } catch (e) {}
            var seconds = 0, played = 0;
            for (var k in map) {
                var v = +map[k] || 0;
                if (v > 0) { seconds += v; played++; }
            }
            var xp = Math.round(seconds) + played * 60;
            var level = Math.floor(Math.sqrt(xp / 60)) + 1;
            var from = 60 * (level - 1) * (level - 1);
            var to = 60 * level * level;
            var pct = Math.max(0, Math.min(100, ((xp - from) / (to - from)) * 100));
            return { xp: xp, level: level, pct: pct, seconds: seconds, played: played };
        };
        (async function() {
            const urlGameName = (location.search.split("?")[1] || "").split("&")[0];
            if (!urlGameName) {
                document.getElementById("loading").innerHTML = "No game specified.";
                return;
            }
            try {
                const games = await (await fetch(CDN + "list_games.json")).json();
                let currentGame;
                games.forEach((g) => {
                    if (clean(g.gameName) == urlGameName) {
                        currentGame = g;
                    }
                });
                const frame = document.getElementById("game-frame");
                const loading = document.getElementById("loading");
                if (currentGame) {
                    window.__phantomGenre = computeGenre(currentGame.gameName);
                    window.PHANTOM = {
                        cleanName: urlGameName,
                        title: currentGame.gameName,
                        genre: window.__phantomGenre,
                        stats: (window.getAccountStats ? window.getAccountStats() : (window.phantomAccountStats ? window.phantomAccountStats() : null)),
                        username: (function () { try { return (JSON.parse(localStorage.getItem("social.v1") || "null") || {}).profile.username; } catch (e) { return null; } })(),
                        avatarSrc: (function () { try { var p = (JSON.parse(localStorage.getItem("social.v1") || "null") || {}).profile; return window.profilePictureSrc ? window.profilePictureSrc(p) : null; } catch (e) { return null; } })(),
                        gameFrame: function () { return document.getElementById("game-frame"); },
                        initialView: false
                    };
                    /* The toolbox loads before this lookup finishes; tell it the
                       game context is ready so its bookmark state is rebuilt. */
                    window.dispatchEvent(new CustomEvent("phantom-context-ready"));
                    if (window.grainient) window.grainient.setup({ label: currentGame.gameName });
                    frame.src = gameUrl(currentGame.gameIndex);
                    frame.addEventListener("load", () => {
                        loading.style.display = "none";
                        if (window.grainient) window.grainient.ready();
                    });
                    setTimeout(() => { if (window.grainient) window.grainient.ready(); }, 12000);
                } else {
                    loading.innerHTML = "Game not found: " + urlGameName;
                    if (window.grainient) window.grainient.ready();
                }
            } catch (e) {
                document.getElementById("loading").innerHTML = "Error loading game.";
                if (window.grainient) window.grainient.ready();
            }
        })();

        const bookmarkBtn = document.getElementById("bookmark-btn");
        const urlGameName = (location.search.split("?")[1] || "").split("&")[0];
        if (urlGameName) {
            /* The controls-bar button opens the toolbox; its icon is the
               toolbox crate and is never filled, even for bookmarked games.
               Bookmarking is toggled from inside the toolbox Quick Settings. */
            bookmarkBtn.addEventListener("click", () => {
                if (window.__openToolbox) window.__openToolbox();
            });
        }

        /* Collapse button can be turned off in the toolbox; when it is the
           bar can't be collapsed, so hide the toggle entirely. */
        function applyControlVisibility() {
            const showCollapse = localStorage.getItem("phantom-btn-collapse") !== "0";
            const toolbar = document.querySelector("#controls .ctrl-toggle");
            if (toolbar) toolbar.style.display = showCollapse ? "" : "none";
            if (!showCollapse) controls.classList.remove("collapsed");
        }
        applyControlVisibility();
        window.addEventListener("phantom-display-change", applyControlVisibility);

    <script>
        (function () {
            var PAUSE_DELAY = 90000; /* 1.5 min away before auto-pausing */
            var overlay = document.getElementById("pause-overlay");
            if (!overlay) return;
            var paused = false;
            var hidden = false;
            var frozenAt = null;
            var awayTimer = null;
            var listeners = [];

            function gameFrame() {
                return document.getElementById("game-frame") || document.querySelector("ruffle-player");
            }
            function notify() {
                for (var i = 0; i < listeners.length; i++) {
                    try { listeners[i](paused); } catch (e) {}
                }
            }
            function setPaused(p, silent) {
                paused = p;
                overlay.classList.toggle("active", p);
                overlay.classList.toggle("dim", !!p && !!silent);
                var f = gameFrame();
                /* Silent (toolbox) pause keeps the frame visible so the game
                   still shows through the light backdrop; the normal pause
                   hides it behind the resume prompt. */
                if (f) f.style.visibility = (p && !silent) ? "hidden" : "visible";
                notify();
            }
            function armTimer() {
                if (!paused && hidden) {
                    awayTimer = setTimeout(function () { setPaused(true); }, PAUSE_DELAY);
                }
            }
            function onHidden() {
                hidden = true;
                clearTimeout(awayTimer);
                armTimer();
                notify();
            }
            function onVisible() {
                hidden = false;
                clearTimeout(awayTimer);
                notify();
            }
            overlay.addEventListener("click", function () {
                if (paused) setPaused(false);
            });
            document.addEventListener("visibilitychange", function () {
                if (document.visibilityState === "hidden") onHidden();
                else onVisible();
            });
            document.addEventListener("freeze", function () {
                frozenAt = Date.now();
                onHidden();
            });
            document.addEventListener("resume", function () {
                if (frozenAt != null && Date.now() - frozenAt >= PAUSE_DELAY) setPaused(true);
                frozenAt = null;
                if (document.visibilityState === "hidden") onHidden();
                else onVisible();
            });
            window.addEventListener("pagehide", function () { clearTimeout(awayTimer); });

            window.__isPaused = function () { return paused; };
            window.__setPaused = setPaused;
            window.__addPauseListener = function (fn) { listeners.push(fn); notify(); };
        })();
    </script>
    <script>
        (function () {
            var KEY = "rcdn-playtime";
            var LP_KEY = "rcdn-lastplayed";
            var name = ((location.search.split("?")[1] || "").split("&")[0]).toLowerCase();
            if (!name) return;
            var start = null;
            var timer = null;
            function loadMap(k) { try { return JSON.parse(localStorage.getItem(k) || "{}"); } catch (e) { return {}; } }
            function touchLast() {
                var m = loadMap(LP_KEY);
                m[name] = Date.now();
                try { localStorage.setItem(LP_KEY, JSON.stringify(m)); } catch (e) {}
            }
            function flush() {
                if (start == null) return;
                var now = Date.now();
                var secs = Math.max(0, Math.floor((now - start) / 1000));
                if (secs) {
                    var m = loadMap(KEY);
                    m[name] = (m[name] || 0) + secs;
                    try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {}
                    /* A minute of play counts the day. */
                    if (window.RCDNStreak) window.RCDNStreak.play(secs);
                }
                start = now;
            }
            function isRunning() {
                if (document.visibilityState !== "visible") return false;
                if (window.__isPaused && window.__isPaused()) return false;
                return true;
            }
            function loop() {
                flush();
                if (isRunning()) {
                    touchLast();
                    timer = setTimeout(loop, 5000);
                } else {
                    start = null;
                }
            }
            function refresh() {
                clearTimeout(timer);
                if (isRunning()) {
                    if (start == null) { start = Date.now(); touchLast(); }
                    timer = setTimeout(loop, 5000);
                } else {
                    flush();
                    start = null;
                }
            }
            window.addEventListener("pageshow", refresh);
            window.addEventListener("pagehide", flush);
            window.addEventListener("blur", flush);
            window.addEventListener("beforeunload", flush);
            document.addEventListener("visibilitychange", refresh);
            document.addEventListener("freeze", flush);
            if (window.__addPauseListener) window.__addPauseListener(refresh);
            refresh();
        })();
    </script>

            var pillName = document.getElementById("msg-pill-name");
            var pillPreview = document.getElementById("msg-pill-preview");
            var pillOpen = document.getElementById("msg-pill-open");
            var floatEl = document.getElementById("msg-float");
            var floatTitle = document.getElementById("msg-float-title");
            var floatBody = document.getElementById("msg-float-body");
            var floatInput = document.getElementById("msg-float-input");
            var floatSend = document.getElementById("msg-float-send");
            var floatCompose = document.getElementById("msg-float-compose");

            var MESSAGES_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

            function esc(s) {
                return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
                });
            }
            function readIdList(key) {
                try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; }
            }
            function hasId(key, id) {
                return !!id && readIdList(key).map(String).indexOf(String(id)) !== -1;
            }
            function readSeen() { try { return JSON.parse(localStorage.getItem("msg-seen-v1") || "{}"); } catch (e) { return {}; } }
            function markSeen(convId, ts) {
                if (!convId) return;
                try {
                    var s = readSeen();
                    s[convId] = Math.max(Number(s[convId] || 0), Number(ts || Date.now()));
                    localStorage.setItem("msg-seen-v1", JSON.stringify(s));
                } catch (e) {}
            }
            function preview10(text) {
                var t = String(text == null ? "" : text);
                return t.length > 10 ? t.slice(0, 10) + "…" : t;
            }

            function ensureMyId() {
                if (myId) return Promise.resolve(myId);
                if (!myIdPromise) {
                    myIdPromise = DB.getProfile()
                        .then(function (p) { myId = p && p.id; return myId; })
                        .catch(function () { return null; });
                }
                return myIdPromise;
            }

            /* Subscribe FIRST — before any network call — so realtime events
               are never dropped while the profile request is in flight. */
            function init() {
                console.info("[player] messages: init");
                DB.onMessage(function (m) { handleIncoming(m); });
                DB.onRealtime(function () {});
                ready = true;
                startPoll();
                ensureMyId().then(function (id) {
                    console.info("[player] messages: signed in as", id || "(no profile yet)");
                });
            }

            /* --- Poll fallback: if the realtime socket ever drops (sleep,
               network hiccup), a light sweep still surfaces new messages --- */
            var pollBaseline = Date.now();
            var pollBusy = false;
            async function sweep() {
                if (pollBusy || document.visibilityState !== "visible") return;
                pollBusy = true;
                try {
                    var uid = await ensureMyId();
                    var candidates = [];
                    try {
                        var dms = await DB.getDmList();
                        if (Array.isArray(dms)) { dmsCache = dms; candidates = candidates.concat(dms.filter(d => d && d.convId).map(d => ({ convId: d.convId, type: "dm", title: (d.other && d.other.username) || "User", avatar: d.other && d.other.avatar, senderId: d.other && d.other.id, last: d.last }))); }
                    } catch (e) {}
                    try {
                        var gs = await DB.getGroups();
                        if (Array.isArray(gs)) { groupsCache = gs; candidates = candidates.concat(gs.filter(g => g && g.id).map(g => ({ convId: g.id, type: "group", title: g.name || "Group", avatar: g.avatar, senderId: null, last: g.last }))); }
                    } catch (e) {}
                    for (var i = 0; i < candidates.length; i++) {
                        var c = candidates[i];
                        var last = c.last;
                        if (!last || !last.ts) continue;
                        if (last.ts <= pollBaseline) continue;          // only messages since this page loaded
                        if (uid && last.senderId === uid) continue;     // own messages
                        if (last.type && last.type !== "text") continue;
                        if (pill.hidden === false) continue;            // one pill at a time
                        var seen = readSeen();
                        if (Number(seen[c.convId] || 0) >= last.ts) continue;
                        if (c.type === "dm") {
                            if (hasId("msg-blocked-v1", last.senderId)) continue;
                            if (hasId("msg-muted-v1", last.senderId)) continue;
                        } else if (hasId("msg-muted-v1", c.convId)) {
                            continue;
                        }
                        console.info("[player] sweep surfaced message:", c.convId);
                        showPill(c, last);
                        break;
                    }
                } catch (e) {}
                pollBusy = false;
            }
            function startPoll() {
                /* Realtime is the primary path; this sweep only recovers from a
               dropped socket, so every five minutes is plenty. At one minute
               it re-fetched the whole DM/group list per game tab, all night. */
            setInterval(sweep, 300000);
                document.addEventListener("visibilitychange", function () {
                    if (document.visibilityState === "visible") sweep();
                });
                window.addEventListener("focus", sweep);
            }

            async function resolveConv(convId) {
                if (!dmsCache) {
                    try { dmsCache = await DB.getDmList(); } catch (e) { dmsCache = []; }
                }
                var dm = (dmsCache || []).find(function (d) { return d && d.convId === convId; });
                if (dm) {
                    return { convId: convId, type: "dm", title: (dm.other && dm.other.username) || "User", avatar: dm.other && dm.other.avatar, senderId: dm.other && dm.other.id };
                }
                if (!groupsCache) {
                    try { groupsCache = await DB.getGroups(); } catch (e) { groupsCache = []; }
                }
                var g = (groupsCache || []).find(function (x) { return x && x.id === convId; });
                if (g) {
                    return { convId: convId, type: "group", title: g.name || "Group", avatar: g.avatar, senderId: null };
                }
                return null;
            }

            function avatarContent(info, senderName) {
                var av = info && info.avatar;
                var src = av && av.type === "image" ? av.value : null;
                if (src) return '<img src="' + esc(src) + '" alt=""/>';
                var color = (av && av.color) || "#22c55e";
                var letter = String(info && info.title || senderName || "?").trim().charAt(0).toUpperCase() || "?";
                return '<span style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;background:' + esc(color) + ';color:#fff">' + esc(letter) + "</span>";
            }

            function showPill(info, msg) {
                pillInfo = info;
                pillAvatar.innerHTML = avatarContent(info, "");
                pillName.textContent = info.title || "Message";
                pillPreview.textContent = preview10(msg.content);
                pill.hidden = false;
                pill.classList.remove("leaving");
                pill.style.transform = "translateY(0)";
                clearTimeout(pillTimer);
                pillTimer = setTimeout(dismissPill, 6500);
            }

            function dismissPill(fromSwipe) {
                clearTimeout(pillTimer);
                pill.classList.add("leaving");
                setTimeout(function () {
                    pill.hidden = true;
                    pill.classList.remove("leaving");
                    pill.style.transform = "";
                }, 250);
            }

            async function handleIncoming(m) {
                if (!ready || !m || !m.convId) return;
                console.info("[player] realtime message:", m.convId, m.content);
                var uid = await ensureMyId();
                if (uid && m.senderId === uid) return;
                if (m.type && m.type !== "text") return; // invites/system stay in-app
                if (floatConv === m.convId) {
                    await refreshFloat(true);
                    return;
                }
                var info = await resolveConv(m.convId);
                console.info("[player] resolved conversation:", info ? (info.type + " " + info.title) : "(not found)");
                if (!info) return;
                if (info.type === "dm") {
                    if (hasId("msg-blocked-v1", m.senderId)) return;
                    if (hasId("msg-muted-v1", m.senderId)) return;
                } else if (hasId("msg-muted-v1", info.convId)) {
                    return;
                }
                showPill(info, m);
            }

            /* --- Pill swipe (vertical only) --- */
            var swiping = false, swipeStartY = 0, swipeDy = 0, swipeMoved = false;
            pill.addEventListener("pointerdown", function (e) {
                if (e.target.closest(".msg-pill-open")) return;
                swiping = true;
                swipeMoved = false;
                swipeStartY = e.clientY;
                swipeDy = 0;
                pill.style.transition = "none";
                try { pill.setPointerCapture(e.pointerId); } catch (err) {}
            });
            pill.addEventListener("pointermove", function (e) {
                if (!swiping) return;
                swipeDy = e.clientY - swipeStartY; // vertical only
                if (Math.abs(swipeDy) > 6) swipeMoved = true;
                pill.style.transform = "translateY(" + swipeDy + "px)";
            });
            function endSwipe() {
                if (!swiping) return;
                swiping = false;
                if (Math.abs(swipeDy) > 70) {
                    dismissPill(true); // keep the offset while it fades out
                } else {
                    pill.style.transition = "transform .25s ease";
                    pill.style.transform = "translateY(0)";
                }
            }
            pill.addEventListener("pointerup", endSwipe);
            pill.addEventListener("pointercancel", endSwipe);
            // click on the pill body (without swiping) also opens the chat
            pill.addEventListener("click", function (e) {
                if (e.target.closest(".msg-pill-open")) return;
                if (swipeMoved) { swipeMoved = false; return; }
                if (pillInfo) openFloat(pillInfo.convId, pillInfo);
            });
            pillOpen.addEventListener("click", function () {
                if (pillInfo) openFloat(pillInfo.convId, pillInfo);
            });

            /* --- Floating chat window --- */
            async function openFloat(convId, info) {
                if (!convId) return;
                floatConv = convId;
                floatTitle.textContent = (info && info.title) || "Chat";
                floatEl.hidden = false;
                dismissPill();
                floatBody.innerHTML = '<div class="msg-float-note">Loading…</div>';
                var isBlockedDm = info && info.type === "dm" && hasId("msg-blocked-v1", mSenderIdOf(info));
                setComposeDisabled(isBlockedDm);
                if (isBlockedDm) {
                    floatBody.innerHTML = '<div class="msg-float-note">You blocked this user.</div>';
                    return;
                }
                await refreshFloat(false);
                if (floatInput) floatInput.focus();
            }
            function mSenderIdOf(info) {
                return info && info.senderId ? info.senderId : "";
            }
            function setComposeDisabled(disabled) {
                floatInput.disabled = disabled;
                floatSend.disabled = disabled;
            }
            async function refreshFloat(markNew) {
                if (!floatConv) return;
                var msgs = [];
                try { msgs = await DB.getMessages(floatConv); } catch (e) { msgs = []; }
                if (!Array.isArray(msgs)) msgs = [];
                if (!msgs.length) {
                    floatBody.innerHTML = '<div class="msg-float-note">No messages yet. Say hi!</div>';
                    return;
                }
                floatBody.innerHTML = msgs.map(function (m) {
                    var mine = myId && m.senderId === myId;
                    return '<div class="msg-float-row' + (mine ? " me" : "") + '">' +
                        '<div class="msg-float-bubble">' + esc(m.content || "") + "</div>" +
                    "</div>";
                }).join("");
                floatBody.scrollTop = floatBody.scrollHeight;
                if (markNew !== false) markSeen(floatConv, msgs[msgs.length - 1].ts || Date.now());
            }

            floatCompose.addEventListener("submit", async function (e) {
                e.preventDefault();
                if (!floatConv || floatInput.disabled) return;
                var text = floatInput.value.trim();
                if (!text) return;
                floatInput.value = "";
                try {
                    await DB.sendMessage(floatConv, text);
                    await refreshFloat(true);
                } catch (err) {
                    console.warn("[player] send", err);
                    floatInput.value = text;
                }
            });
            document.getElementById("msg-float-close").addEventListener("click", function () {
                floatEl.hidden = true;
                floatConv = null;
            });

            /* --- Window dragging (by the header) --- */
            var winDrag = false, winStartX = 0, winStartY = 0, winBaseLeft = 0, winBaseTop = 0;
            var head = document.getElementById("msg-float-head");
            head.addEventListener("pointerdown", function (e) {
                if (e.target.closest(".msg-float-close")) return;
                winDrag = true;
                winStartX = e.clientX;
                winStartY = e.clientY;
                var r = floatEl.getBoundingClientRect();
                winBaseLeft = r.left;
                winBaseTop = r.top;
                floatEl.style.right = "auto";
                floatEl.style.left = r.left + "px";
                floatEl.style.top = r.top + "px";
                try { head.setPointerCapture(e.pointerId); } catch (err) {}
            });
            head.addEventListener("pointermove", function (e) {
                if (!winDrag) return;
                var dx = e.clientX - winStartX;
                var dy = e.clientY - winStartY;
                var w = floatEl.offsetWidth;
                var maxLeft = window.innerWidth - 80;
                var minLeft = -(w - 80);
                var maxTop = window.innerHeight - 46;
                floatEl.style.left = Math.max(minLeft, Math.min(winBaseLeft + dx, maxLeft)) + "px";
                floatEl.style.top = Math.max(0, Math.min(winBaseTop + dy, maxTop)) + "px";
            });
            function endWinDrag() { winDrag = false; }
            head.addEventListener("pointerup", endWinDrag);
            head.addEventListener("pointercancel", endWinDrag);

            init();
        })();
    </script>
    <script>
        /* Incoming-call ring while a movie is playing. Accepting hands
           the call to index.html (via sessionStorage) where the full
           session UI lives; declining marks the row and logs it in the
           DM — same shape as the index.html ring overlay. */
        (function () {
            if (!window.DB) return;
            var PHONE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8.04253 9.89057L8.32962 9.54607C9.13196 8.58326 9.53312 8.10186 9.67708 7.56536C9.79932 7.10976 9.79165 6.62904 9.65494 6.17757C9.49394 5.64593 9.07762 5.17757 8.24498 4.24085C7.64122 3.56162 7.33933 3.222 6.97835 3.09096C6.67272 2.98002 6.33952 2.97023 6.0279 3.06303C5.65985 3.17264 5.33854 3.49395 4.69593 4.13656L3.87514 4.95736C3.42449 5.408 3.19917 5.63332 3.08405 5.94695C2.96892 6.26057 2.99192 6.54106 3.03791 7.10204C3.64253 14.477 9.52318 20.3577 16.8981 20.9623C17.4591 21.0083 17.7396 21.0313 18.0532 20.9161C18.3669 20.801 18.5922 20.5757 19.0428 20.125L19.8636 19.3043C20.5062 18.6616 20.8275 18.3403 20.9371 17.9723C21.03 17.6607 21.0202 17.3275 20.9092 17.0218C20.7782 16.6608 20.4386 16.359 19.7593 15.7552C18.8226 14.9226 18.3542 14.5062 17.8226 14.3452C17.3711 14.2085 16.8904 14.2009 16.4348 14.3231C15.8983 14.4671 15.4169 14.8682 14.4541 15.6706L14.1096 15.9577C11.2048 14.9894 9.00786 12.7866 8.04253 9.89057Z"></path></svg>';
            var overlay = null, currentId = null, currentCaller = null, ringTimer = null;

            function myId() {
                /* "rcdn_profile" is a legacy key nothing writes; the signed-in id lives in social.v1 (what db.js uses too), so falling back to it is what lets the ring match this browser's user. */
                try { var own = (JSON.parse(localStorage.getItem("rcdn_profile") || "null") || {}).id; if (own) return own; } catch (e) {}
                try { var prof = (JSON.parse(localStorage.getItem("social.v1") || "null") || {}).profile; if (prof && prof.id) return prof.id; } catch (e) {}
                return null;
            }
            function avatarOf(p) {
                var pic = null;
                if (p && p.avatarPath && DB.avatarUrl) pic = DB.avatarUrl(p.avatarPath);
                if (!pic && p && p.avatar && p.avatar.type === "image") pic = p.avatar.value || p.avatar.data || p.avatar.url || null;
                if (pic) return '<img src="' + pic + '" alt="">';
                var a = (p && p.avatar) || {};
                var bg = (a.accent || a.color) || "#444";
                var letter = ((p && p.username) || "U").charAt(0).toUpperCase();
                return '<span class="call-ring-fallback" style="background:' + bg + '">' + letter + '</span>';
            }
            function ensure() {
                if (overlay) return overlay;
                overlay = document.createElement("div");
                overlay.className = "call-ring";
                overlay.hidden = true;
                overlay.innerHTML = '<div class="call-ring-card">' +
                    '<div class="call-ring-av"></div>' +
                    '<div class="call-ring-name"></div>' +
                    '<div class="call-ring-sub">Incoming call</div>' +
                    '<div class="call-ring-actions">' +
                    '<button class="call-ring-btn decline" type="button" aria-label="Decline">' + PHONE_SVG + '</button>' +
                    '<button class="call-ring-btn accept" type="button" aria-label="Accept">' + PHONE_SVG + '</button>' +
                    '</div></div>';
                document.body.appendChild(overlay);
                overlay.querySelector(".accept").addEventListener("click", function () {
                    if (!currentId) return;
                    try { sessionStorage.setItem("rcdn-answer-call", currentId); } catch (e) {}
                    location.href = "index.html?view=calls";
                });
                overlay.querySelector(".decline").addEventListener("click", function () {
                    if (!currentId) return;
                    var id = currentId, caller = currentCaller;
                    dismiss();
                    if (DB.updateCall) DB.updateCall(id, { status: "declined" });
                    logDeclined(caller);
                });
                return overlay;
            }
            function logDeclined(callerId) {
                if (!callerId || !DB.ensureDm || !DB.sendMessage) return;
                DB.ensureDm(callerId).then(function (conv) {
                    return DB.sendMessage(conv && (conv.id || conv.convId), "declined a call");
                }).catch(function (e) {});
            }
            function offer(c, peer) {
                if (currentId) return;
                currentId = c.id;
                currentCaller = c.callerId;
                var o = ensure();
                o.querySelector(".call-ring-name").textContent = (peer && peer.username) || "User";
                o.querySelector(".call-ring-av").innerHTML = avatarOf(peer);
                o.hidden = false;
                ringTimer = setTimeout(dismiss, 30000);
            }
            function dismiss() {
                if (ringTimer) { clearTimeout(ringTimer); ringTimer = null; }
                currentId = null;
                currentCaller = null;
                if (overlay) overlay.hidden = true;
            }
            if (DB.onIncomingCall) {
                DB.onIncomingCall(function (c) {
                    if (!c) return;
                    var me = myId();
                    if (c.calleeId === me && c.callerId !== me) {
                        if (c.status === "ringing") {
                            DB.getProfileById(c.callerId).then(function (p) { offer(c, p); }).catch(function () { offer(c, null); });
                        } else if (c.id === currentId) {
                            dismiss();
                        }
                    }
                });
            }
            setInterval(function () {
                if (currentId || !DB.getActiveIncomingCall) return;
                if (DB._callsRt === "subscribed") return;
                DB.getActiveIncomingCall().then(function (c) {
                    if (c && !currentId && c.calleeId === myId() && c.status === "ringing") {
                        DB.getProfileById(c.callerId).then(function (p) { offer(c, p); }).catch(function () { offer(c, null); });
                    }
                }).catch(function () {});
            }, 8000);
        })();
    </script>
