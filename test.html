<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom</title>
</head>
<body>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: clamp(30px, 10vw, 50px);
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            --indicator-top: 0px;
        }

        .sidebar::after {
            content: "";
            position: absolute;
            top: var(--indicator-top);
            left: 0;
            width: 3px;
            height: 24px;
            border-radius: 0 3px 3px 0;
            background-color: #fff;
            pointer-events: none;
            transition: top 0.25s ease;
        }

        .logo {
            width: 75%;
            height: 50px;
            border: none;
            filter: invert(100%);
        }

        button {
            position: relative;
            width: 100%;
            height: 50px;
            background-color: transparent;
            border: none;
            color: #BDBDBD;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        button:hover {
            color: #fff;
        }

        button.active {
            color: #fff;
        }

        .divider {
            width: 80%;
            height: 1px;
            background-color: #333;
            margin: 10px 0;
        }

        .mode-toggles {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c2c2c;
            margin-bottom: 10px;
            border-radius: 45vh;
            border: 1px solid #444;
        }

        .day, .device, .night {
            width: 100%;
            height: 35px;
            background-color: transparent;
            border: none;
            color: #BDBDBD;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            scale: 0.8;
        }

        .main {
            margin-left: clamp(30px, 10vw, 50px);
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
        }

        .card {
            height: 75px;
            width: 250px;
            background-color: #222;
            border-radius: 10px;
            margin: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            background-color: #292929;
            transform: translateY(-2px);
        }

        .cover {
            width: 40px;
            aspect-ratio: 1/1;
            background: linear-gradient(135deg, #ff3300, #ffaa00);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .des {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: 20px;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
        }

        .playtime {
            font-size: 12px;
            color: #aaa;
        }

        .play {
            background-color: #444;
            width: 35px;
            height: 35px;
            border-radius: 100px;
            margin-left: auto;
            & svg{
                scale: 0.8;
            }
        }

    </style>
    <div class="sidebar">
        <img src="ricon.svg" alt="" class="logo">
        <div class="divider"></div>
        <button class="home"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
        <button class="games"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-swords-icon lucide-swords"><path d="m13 19 6-6"/><path d="M14.5 17.5 3.586 6.586A2 2 0 013 5.172V3h2.172a2 2 0 011.414.586L17.5 14.5"/><path d="m14.828 6.172 2.586-2.586A2 2 0 0118.828 3H21v2.172a2 2 0 01-.586 1.414l-2.586 2.586"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="m5 14 4 4"/><path d="m5 21-2-2"/><path d="M7.5 16.5 4 20"/></svg></button>
        <button class="movies"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-popcorn-icon lucide-popcorn"><path d="M18 8a2 2 0 0 0 0-4 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0 0 4"/><path d="M10 22 9 8"/><path d="m14 22 1-14"/><path d="M20 8c.5 0 .9.4.8 1l-2.6 12c-.1.5-.7 1-1.2 1H7c-.6 0-1.1-.4-1.2-1L3.2 9c-.1-.6.3-1 .8-1Z"/></svg></button>
        <button class="apps"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-smartphone-icon lucide-smartphone"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg></button>
        <button class="explore"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-compass-icon lucide-compass"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"/></svg></button>
        <button class="settings"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bolt-icon lucide-bolt"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><circle cx="12" cy="12" r="4"/></svg></button>
        <div class="mode-toggles">
            <button class="day"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
            <button class="device"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-tv-minimal-icon lucide-tv-minimal"><path d="M7 21h10"/><rect width="20" height="14" x="2" y="3" rx="2"/></svg></button>
            <button class="night"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon-icon lucide-moon"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></button>
        </div>
    </div>
    <div class="main">
    <div class="card">
        <div class="cover">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-car"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
        </div>
        <div class="des">
            <div class="title">Game</div>
            <div class="playtime">30s</div>
        </div>
        <button class="play"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-play"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></button>
    </div>
    </div>
    <script>
        const sidebar = document.querySelector('.sidebar');
        const buttons = sidebar.querySelectorAll('button');
        const home = sidebar.querySelector('.home');

        home.classList.add('active');
        sidebar.style.setProperty('--indicator-top', `${home.offsetTop + (home.offsetHeight - 24) / 2}px`);

        buttons.forEach(button => {
            button.addEventListener('mouseenter', () => {
                buttons.forEach(tab => tab.classList.remove('active'));
                button.classList.add('active');
                sidebar.style.setProperty('--indicator-top', `${button.offsetTop + (button.offsetHeight - 24) / 2}px`);
            });
        });

        sidebar.addEventListener('mouseleave', () => {
            buttons.forEach(button => button.classList.remove('active'));
            home.classList.add('active');
            sidebar.style.setProperty('--indicator-top', `${home.offsetTop + (home.offsetHeight - 24) / 2}px`);
        });
    </script>
</body>
</html>
