<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="favicon.png?v=1" />
    <title>Phantom</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }
        #controls {
            position: fixed;
            left: 0;
            top: 16px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 4px;
            background: greenyellow;
            border-radius: 0 100px 100px 0;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: grab;
            user-select: none;
            padding: 4px 8px 4px 4px;
            overflow: hidden;
        }
        #controls.collapsed {
            padding: 0;
            gap: 0;
        }
        #controls.collapsed .ctrl-actions {
            display: none;
        }
        #controls.collapsed .ctrl-toggle svg {
            transform: rotate(180deg);
        }
        .ctrl-toggle {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            color: #212121;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ctrl-toggle:hover {
            opacity: 0.7;
        }
        .ctrl-toggle svg {
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .ctrl-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }
        .back-btn {
            background: transparent;
            border: none;
            color: #212121;
            padding: 8px 16px;
            border-radius: 100px;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn:hover {
            opacity: 0.7;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .loading .bar {
            width: 200px;
            height: 4px;
            background: rgba(173, 255, 47, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
        .loading .bar-fill {
            height: 100%;
            width: 30%;
            background: greenyellow;
            border-radius: 4px;
            animation: loadingBar 1.4s ease-in-out infinite;
        }
        @keyframes loadingBar {
            0% { transform: translateX(-100%); width: 30%; }
            50% { width: 50%; }
            100% { transform: translateX(400%); width: 30%; }
        }
    </style>
</head>
<body>
    <script src="cdn.js?v=5"></script>
    <div id="controls">
        <button class="ctrl-toggle" id="ctrl-toggle">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        </button>
        <div class="ctrl-actions" id="ctrl-actions">
            <button class="back-btn" onclick="history.back()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </div>
    <div class="loading" id="loading">
        <div class="bar"><div class="bar-fill"></div></div>
    </div>
    <video id="movie-player" controls playsinline></video>
    <iframe id="yt-player" style="display:none;width:100%;height:100%;border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <script>
        const controls = document.getElementById("controls");
        const toggle = document.getElementById("ctrl-toggle");

        const savedTop = localStorage.getItem("controls-top");
        if (savedTop) {
            controls.style.top = savedTop;
        }

        toggle.addEventListener("click", () => {
            controls.classList.toggle("collapsed");
        });

        let isDragging = false;
        let wasDragged = false;
        let startY, startTop;

        function isDragHandle(el) {
            return !el.closest("#ctrl-actions");
        }

        controls.addEventListener("mousedown", (e) => {
            if (!isDragHandle(e.target)) return;
            isDragging = true;
            wasDragged = false;
            startY = e.clientY;
            startTop = controls.offsetTop;
            controls.style.cursor = "grabbing";
            e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            const dy = e.clientY - startY;
            if (Math.abs(dy) > 5) wasDragged = true;
            let newTop = startTop + dy;
            const maxTop = window.innerHeight - controls.offsetHeight;
            newTop = Math.max(0, Math.min(newTop, maxTop));
            controls.style.top = newTop + "px";
        });

        document.addEventListener("mouseup", () => {
            if (!isDragging) return;
            isDragging = false;
            controls.style.cursor = "grab";
            if (wasDragged) {
                localStorage.setItem("controls-top", controls.style.top);
            }
        });

        controls.addEventListener("touchstart", (e) => {
            if (!isDragHandle(e.target)) return;
            isDragging = true;
            wasDragged = false;
            startY = e.touches[0].clientY;
            startTop = controls.offsetTop;
        });

        document.addEventListener("touchmove", (e) => {
            if (!isDragging) return;
            const dy = e.touches[0].clientY - startY;
            if (Math.abs(dy) > 5) wasDragged = true;
            let newTop = startTop + dy;
            const maxTop = window.innerHeight - controls.offsetHeight;
            newTop = Math.max(0, Math.min(newTop, maxTop));
            controls.style.top = newTop + "px";
        });

        document.addEventListener("touchend", () => {
            if (!isDragging) return;
            isDragging = false;
            if (wasDragged) {
                localStorage.setItem("controls-top", controls.style.top);
            }
        });

        function clean(str) {
            return str.toLowerCase().replace(/[^a-z0-9]/g, "");
        }

        (async function() {
            const urlName = location.search.split("?")[1];
            const loading = document.getElementById("loading");
            const v = document.getElementById("movie-player");
            const yt = document.getElementById("yt-player");
            if (!urlName) {
                loading.innerHTML = "No movie specified.";
                return;
            }
            try {
                const movies = await (await fetch(CDN + "list_movies.json?v=3")).json();
                let movie;
                movies.forEach((m) => {
                    if (clean(m.title) === urlName) movie = m;
                });
                if (!movie) {
                    loading.innerHTML = "Movie not found: " + urlName;
                    return;
                }
                const abs = (p) => (/^https?:\/\//.test(p) ? p : CDN + p);
                const hideLoading = () => { loading.style.display = "none"; };
                if (movie.youtube) {
                    v.style.display = "none";
                    yt.style.display = "block";
                    yt.src = "https://www.youtube-nocookie.com/embed/" + movie.youtube + "?rel=0&modestbranding=1";
                    yt.addEventListener("load", hideLoading, { once: true });
                    setTimeout(hideLoading, 12000);
                } else {
                    if (movie.poster) v.poster = abs(movie.poster);
                    v.src = abs(movie.video);
                    v.addEventListener("loadeddata", hideLoading);
                    v.addEventListener("error", () => {
                        loading.innerHTML = "Couldn't load this movie.";
                    });
                    setTimeout(hideLoading, 12000);
                }
            } catch (e) {
                loading.innerHTML = "Error loading movie.";
            }
        })();
    </script>
</body>
</html>
